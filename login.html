<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in | QuickTrade</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>

  <!-- Minimal Header -->
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html">
        <img src="assets/images/Stock logo.png" alt="QuickTrade">
      </a>
      <a href="index.html" class="nav-link">← Back to Home</a>
    </div>
  </header>

  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-header">
        <h2>Sign in</h2>
        <p>Access your portfolio and live watchlists</p>
      </div>

      <form id="loginForm" onsubmit="event.preventDefault(); alert('Sign in successful! Redirecting...'); window.location.href='stock.html';">
        <div class="form-group">
          <label for="email">Email or Mobile Number</label>
          <input type="text" id="email" class="form-input" placeholder="name@example.com" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-input" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn-full">Sign In</button>
      </form>

      <div class="divider">
        <span>or</span>
      </div>

      <div class="social-row">
        <button class="social-btn" onclick="alert('Google Sign-In');">
          <img src="assets/images/google.png" alt="Google"> Google
        </button>
        <button class="social-btn" onclick="alert('Apple Sign-In');">
          <img src="assets/images/apple.png" alt="Apple"> Apple
        </button>
      </div>

      <div class="login-footer-link">
        Don't have an account? <a href="index.html#account">Open a free account</a>
      </div>
    </div>
  </div>

</body>
</html>
